
services:
  backend:
    build:
      context: ./questlish-backend
      dockerfile: Dockerfile
    container_name: questlish-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/questlish.db
      QUESTLISH_SECRET_KEY: ${QUESTLISH_SECRET_KEY:-questlish-local-development-key-change-in-production}
    volumes:
      - questlish_data:/app/data
    restart: always

  frontend:
    build:
      context: ./questlish-fronted
      dockerfile: Dockerfile
    container_name: questlish-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  questlish_data:
